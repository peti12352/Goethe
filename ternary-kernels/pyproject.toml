[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ternary-flash"
version = "0.1.1"
description = "goethe: ternary MoE expert packs and SGLang runtime for DeepSeek-V4.1-Flash and Qwen3.8-Flash-Next"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "meshapplied" }]
keywords = ["ternary", "moe", "quantization", "sglang", "llm", "goethe"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch",
  "safetensors",
  "triton",
  "huggingface_hub",
]

[project.optional-dependencies]
sglang = []
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/meshapplied/goethe"
Documentation = "https://github.com/meshapplied/goethe"

[tool.setuptools.packages.find]
where = ["."]
include = ["ternary_runtime*"]

[tool.setuptools.package-data]
ternary_runtime = ["csrc/*.cu", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["ternary_runtime/tests"]
