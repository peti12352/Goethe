# Ternary expert overlay on deepseek-ai/DeepSeek-V4.1-Flash, not NVFP4 weights.
# Prefer examples/serve_deepseek.sh. Needs full base + Engram host RAM.

[model]
path = "${TERNARY_MODEL_DIR}"
name = "deepseek-v41-flash-ternary"

[ternary]
pack_dir = "${TERNARY_PACK_DIR}"

[serve]
engine = "sglang"
host = "127.0.0.1"
port = 30001
tp_size = 1
dtype = "bfloat16"
trust_remote_code = true
mem_fraction_static = 0.90
